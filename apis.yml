aid: thinksono
name: ThinkSono
description: >-
  ThinkSono is a medical technology company that develops AI-powered ultrasound
  software enabling non-specialist clinicians to detect deep vein thrombosis
  (DVT) blood clots at the point of care. Its real-time AI guidance walks a
  clinician through capturing and interpreting a compression ultrasound scan,
  compressing what is typically a full-day specialist referral pathway into an
  approximately 30-minute point-of-care assessment. The product is positioned
  for hospital and primary-care settings (including NHS deployments) to reduce
  DVT diagnostic waiting times. ThinkSono is a portfolio company of Speedinvest.
  It is a B2B medical-device software business and does not currently publish a
  public developer API, SDK, or API documentation surface.
